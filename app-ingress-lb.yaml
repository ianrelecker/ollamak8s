apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-lb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your/repo.git
    targetRevision: main
    path: ingress-lb
  destination:
    name: in-cluster
    namespace: ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
